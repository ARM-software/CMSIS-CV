solution:
  created-for: cmsis-toolbox@2.15.0
  compiler: AC6@6.24.0

  language-C: c11
  language-CPP: c++17
  cdefault:

  packs:
    - pack: ARM::CMSIS@6.0.0
    - pack: ARM::CMSIS-DSP@1.15.0
    - pack: ARM::V2M_MPS3_SSE_300_BSP@1.4.0
    - pack: ARM::Cortex_DFP@1.0.0

  target-types:
    - type: VHT-Corstone-300
      device: ARM::SSE-300-MPS3
      board: ARM::V2M-MPS3-SSE-300-FVP
      define:
        - CORTEXM
        - ARMCM55
        - FVP
      misc:
        - for-compiler: GCC
          Link:
            - --specs=rdimon.specs
          Library:
            - -lrdimon
        - for-compiler: CLANG
          Link:
            - -lcrt0-semihost
            - -lsemihost

    - type: VHT-M0P
      device: ARMCM0P
      define:
        - CORTEXM
        - ARMCM0P
        - DISABLEFLOAT16
        - FVP
      misc:
        - for-compiler: GCC
          Link:
            - --specs=rdimon.specs
          Library:
            - -lrdimon
        - for-compiler: CLANG
          Link:
            - -lcrt0-semihost
            - -lsemihost

    - type: VHT-M4
      device: ARMCM4
      define:
        - CORTEXM
        - ARMCM4_FP
        - DISABLEFLOAT16
        - FVP
      misc:
        - for-compiler: GCC
          Link:
            - --specs=rdimon.specs
          Library:
            - -lrdimon
        - for-compiler: CLANG
          Link:
            - -lcrt0-semihost
            - -lsemihost

    - type: VHT-M7
      device: ARMCM7
      define:
        - CORTEXM
        - ARMCM7_DP
        - DISABLEFLOAT16
        - FVP
        - HASCACHE
      misc:
        - for-compiler: GCC
          Link:
            - --specs=rdimon.specs
          Library:
            - -lrdimon
        - for-compiler: CLANG
          Link:
            - -lcrt0-semihost
            - -lsemihost

  build-types:
    - type: Release
      debug: on


  projects:
    - project: ./cmsiscv.cproject.yml
